<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Inter'; src: local('DejaVu Sans'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: #0B1120;
    font-family: 'DejaVu Sans', 'Segoe UI', Roboto, sans-serif;
    color: #E8EEF9;
    position: relative;
  }
  .glow {
    position: absolute; width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(45,212,191,0.20), transparent 65%);
    top: -260px; left: -140px;
  }
  .glow2 {
    position: absolute; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(96,165,250,0.18), transparent 65%);
    bottom: -280px; right: -120px;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(35,48,77,0.35) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(35,48,77,0.35) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 78%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 78%);
  }
  .content { position: relative; z-index: 2; display: flex; align-items: center; height: 100%; padding: 0 60px; }
  .left { flex: 1; }
  .logo { width: 76px; height: 76px; border-radius: 20px; margin-bottom: 22px;
    background: linear-gradient(135deg,#2DD4BF,#60A5FA);
    display:flex; align-items:center; justify-content:center; }
  h1 { font-size: 62px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; }
  .tag { font-size: 25px; color: #94A3B8; margin-top: 12px; font-weight: 400; letter-spacing: 0.3px; }
  .pills { display: flex; gap: 12px; margin-top: 30px; }
  .pill { background: rgba(45,212,191,0.10); border: 1.5px solid rgba(45,212,191,0.45);
    color: #5EEAD4; padding: 9px 18px; border-radius: 30px; font-size: 16px; font-weight: 600; }
  .pill.b { background: rgba(96,165,250,0.10); border-color: rgba(96,165,250,0.45); color:#93C5FD; }
  .right { width: 360px; display:flex; align-items:center; justify-content:center; }
  .card { width: 320px; background: rgba(20,27,46,0.92); border: 1.5px solid #23304D;
    border-radius: 22px; padding: 26px 24px; box-shadow: 0 30px 70px rgba(0,0,0,0.5); }
  .label { color: #64748B; font-size: 12px; font-weight: 700; letter-spacing: 1.4px; margin-bottom: 10px; }
  .cidr { font-family: 'DejaVu Sans Mono', monospace; font-size: 30px; font-weight: 700; color: #2DD4BF; }
  .row { display:flex; justify-content:space-between; margin-top: 16px;
    border-top: 1px solid #23304D; padding-top: 12px; }
  .k { color: #94A3B8; font-size: 14px; }
  .v { font-family: 'DejaVu Sans Mono', monospace; color:#E8EEF9; font-size: 15px; font-weight: 600; }
  .bits { display:flex; gap: 4px; margin-top: 16px; }
  .bit { flex:1; height: 26px; border-radius: 4px; background: rgba(45,212,191,0.16);
    border: 1px solid rgba(45,212,191,0.4); }
  .bit.h { background: rgba(100,116,139,0.12); border-color: rgba(100,116,139,0.35); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="grid"></div>
  <div class="content">
    <div class="left">
      <div class="logo">
        <svg width="44" height="44" viewBox="0 0 48 48" fill="none">
          <rect x="6" y="6" width="36" height="36" rx="9" stroke="#0B1120" stroke-width="5"/>
          <line x1="24" y1="11" x2="24" y2="37" stroke="#0B1120" stroke-width="4.5" stroke-linecap="round"/>
          <line x1="11" y1="24" x2="37" y2="24" stroke="#0B1120" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>NetCarve</h1>
      <div class="tag">Subnet &amp; CIDR Calculator</div>
      <div class="pills">
        <div class="pill">Works offline</div>
        <div class="pill b">No ads</div>
        <div class="pill">IPv4 + IPv6</div>
      </div>
    </div>
    <div class="right">
      <div class="card">
        <div class="label">NETWORK BLOCK</div>
        <div class="cidr">10.20.16.0/20</div>
        <div class="row"><span class="k">Broadcast</span><span class="v">10.20.31.255</span></div>
        <div class="row"><span class="k">Usable hosts</span><span class="v">4,094</span></div>
        <div class="bits">
          <div class="bit"></div><div class="bit"></div><div class="bit"></div><div class="bit"></div>
          <div class="bit"></div><div class="bit"></div><div class="bit"></div><div class="bit"></div>
          <div class="bit"></div><div class="bit"></div><div class="bit h"></div><div class="bit h"></div>
          <div class="bit h"></div><div class="bit h"></div><div class="bit h"></div><div class="bit h"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
